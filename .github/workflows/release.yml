name: Release

# main: lint, then build, then publish a GitHub release "v<version>" (version from
# Cargo.toml) with the portable zip and the installer. If a release for that version
# already exists it is replaced, so only a version bump creates a new release.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  lint:
    uses: ./.github/workflows/lint.yml

  build:
    needs: lint
    uses: ./.github/workflows/build.yml

  release:
    name: publish release
    needs: build
    # A manual run on another branch must not publish.
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history and tags for the changelog

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create or replace the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          $ErrorActionPreference = 'Continue'
          $tag = "v$env:VERSION"

          # Previous release = newest other version tag. When this version was already
          # released, its commits are simply re-listed under the replacement.
          $previous = git tag --list 'v*' --sort=-v:refname | Where-Object { $_ -ne $tag } | Select-Object -First 1
          $notes = ./scripts/changelog.ps1 -From $previous
          if ($previous) {
            $notes += "`n`n**Full changelog:** https://github.com/$env:GITHUB_REPOSITORY/compare/$previous...$tag"
          }
          Set-Content -Path notes.md -Value $notes -Encoding utf8
          Get-Content notes.md

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Replacing existing release $tag"
            gh release delete $tag --yes --cleanup-tag
            if ($LASTEXITCODE -ne 0) { throw "could not delete the existing release $tag" }
          }

          $assets = Get-ChildItem artifacts -Recurse -File | ForEach-Object { $_.FullName }
          Write-Host "Assets: $($assets -join ', ')"
          gh release create $tag @assets --title "mocli $tag" --notes-file notes.md --target $env:GITHUB_SHA --latest
          if ($LASTEXITCODE -ne 0) { throw "could not create release $tag" }
